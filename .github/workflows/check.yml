name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out the revision
        env:
          CHECK_TOKEN: ${{ github.token }}
          CHECK_REVISION: ${{ github.sha }}
        run: |
          git init --quiet --template= .
          git -c credential.helper= -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$CHECK_TOKEN"; }; f' fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$CHECK_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Prepare Node.js 24.19.0 with npm
        run: |
          curl --fail --silent --show-error --location https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz --output "$RUNNER_TEMP/node.tar.xz"
          echo "14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647  $RUNNER_TEMP/node.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.19.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Prepare mise
        uses: ./.github/actions/prepare-mise
      - name: Prepare the environment
        run: mise run setup
      - name: Prepare Quarto
        run: |
          version="$(mise exec -- printenv QUARTO_VERSION)"
          sha256="$(mise exec -- printenv QUARTO_LINUX_AMD64_SHA256)"
          curl --fail --silent --show-error --location "https://github.com/quarto-dev/quarto-cli/releases/download/v${version}/quarto-${version}-linux-amd64.deb" --output "$RUNNER_TEMP/quarto.deb"
          echo "${sha256}  $RUNNER_TEMP/quarto.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/quarto.deb"
      - name: Prepare PDF text converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Prepare CodexBar
        run: |
          version="$(mise exec -- printenv CODEXBAR_VERSION)"
          sha256="$(mise exec -- printenv CODEXBAR_LINUX_AMD64_SHA256)"
          curl --fail --silent --show-error --location "https://github.com/steipete/CodexBar/releases/download/v${version}/CodexBarCLI-v${version}-linux-x86_64.tar.gz" --output "$RUNNER_TEMP/codexbar.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/codexbar.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/codexbar"
          tar -xzf "$RUNNER_TEMP/codexbar.tar.gz" -C "$RUNNER_TEMP/codexbar"
          echo "$RUNNER_TEMP/codexbar" >> "$GITHUB_PATH"
      - name: Prepare the CI Git identity
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@users.noreply.github.com'
      - name: Install the Git hooks
        run: ./node_modules/.bin/lefthook install
      - name: Run all checks
        run: mise exec -- npm run check
