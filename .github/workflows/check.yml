name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_PARANOID: 'true'
      MISE_LOCKED_VERIFY_PROVENANCE: 'true'
      MISE_USE_VERSIONS_HOST_TRACK: 'false'
      MISE_GITHUB_GH_CLI_TOKENS: 'false'
    steps:
      - name: Check out the revision
        env:
          CHECK_TOKEN: ${{ github.token }}
          CHECK_REVISION: ${{ github.sha }}
        run: |
          git init --quiet --template= .
          git -c credential.helper= -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$CHECK_TOKEN"; }; f' fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$CHECK_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Prepare Node.js 24.19.0 with npm
        run: |
          curl --fail --silent --show-error --location https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz --output "$RUNNER_TEMP/node.tar.xz"
          echo "14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647  $RUNNER_TEMP/node.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.19.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Prepare mise 2026.9.16
        run: |
          curl --fail --silent --show-error --location https://github.com/jdx/mise/releases/download/v2026.9.16/mise-v2026.9.16-linux-x64.tar.gz --output "$RUNNER_TEMP/mise.tar.gz"
          echo "2e022482d62a3b9e6c0bc51d3e883401bfa7e4684b60f3b819b21eae4ebdb438  $RUNNER_TEMP/mise.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mise.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mise/bin" >> "$GITHUB_PATH"
      - name: Trust mise config and install locked tools
        run: |
          mise trust --yes "$GITHUB_WORKSPACE/mise.toml"
          mise install --locked aqua:astral-sh/uv@0.11.32 aqua:lycheeverse/lychee@0.24.2 aqua:vale-cli/vale@3.23.0 github:gittower/git-flow-next@2.1.0
      - name: Prepare Quarto 1.10.18
        run: |
          curl --fail --silent --show-error --location https://github.com/quarto-dev/quarto-cli/releases/download/v1.10.18/quarto-1.10.18-linux-amd64.deb --output "$RUNNER_TEMP/quarto.deb"
          echo "4bdf5a17df300003beb2f8f0e4dfe568e2ca0ff91318220c8537d2655015c430  $RUNNER_TEMP/quarto.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/quarto.deb"
      - name: Prepare the CI Git identity
        run: |
          git config --global user.name 'CI'
          git config --global user.email 'ci@users.noreply.github.com'
      - name: Prepare frozen dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mise exec -- uv python install --no-bin "$(cat packages/backfire/.python-version)"
          mise exec -- uv sync --locked --all-packages --extra education --no-build-package grimp
          mise exec -- uv sync --locked --project tools/spec-kit
          mise exec -- uv sync --locked --project tools/shellcheck
          mise exec -- uv sync --locked --project tools/ruff
          mise exec -- uv sync --locked --project tools/check-jsonschema
          mise exec -- uv sync --locked --project tools/commitizen
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/wiki-consistency
          mise exec -- npm run backfire:install
          ./node_modules/.bin/lefthook install
          git config gitflow.shared.trustHooks true
          mise exec -- git flow config sync
      - name: Run all checks
        run: mise exec -- npm run check
      - name: Run Backfire deadline tests
        run: mise exec -- npm run test:backfire-slow
