name: Documentation references

on:
  pull_request:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request revision
        env:
          DOCS_TOKEN: ${{ github.token }}
          DOCS_REVISION: ${{ github.sha }}
        run: |
          git init --quiet --template= .
          git -c credential.helper= -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$DOCS_TOKEN"; }; f' fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$DOCS_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Prepare Node.js 24.19.0 with npm
        run: |
          curl --fail --silent --show-error --location https://nodejs.org/dist/v24.19.0/node-v24.19.0-linux-x64.tar.xz --output "$RUNNER_TEMP/docs-node.tar.xz"
          echo "14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647  $RUNNER_TEMP/docs-node.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/docs-node.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-v24.19.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Prepare mise
        uses: ./.github/actions/prepare-mise
      - name: Prepare frozen dependencies
        run: |
          mise install --locked aqua:astral-sh/uv
          mise exec -- uv python install --no-bin "$(cat packages/backfire/.python-version)"
          npm ci --ignore-scripts --no-audit --no-fund
          mise exec -- uv sync --locked --no-dev --project packages/doc-regions
      - name: Check generated references
        run: mise exec -- npm run doc-regions:check
