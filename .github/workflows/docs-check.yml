name: Documentation references

on:
  pull_request:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request revision
        env:
          DOCS_TOKEN: ${{ github.token }}
          DOCS_REVISION: ${{ github.sha }}
        run: |
          git init --quiet --template= .
          git -c credential.helper= -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$DOCS_TOKEN"; }; f' fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$DOCS_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Prepare standalone Deno 2.9.6
        run: |
          curl --fail --silent --show-error --location https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip --output "$RUNNER_TEMP/docs-deno.zip"
          unzip -q "$RUNNER_TEMP/docs-deno.zip" -d "$RUNNER_TEMP/docs-deno"
          echo "$RUNNER_TEMP/docs-deno" >> "$GITHUB_PATH"
      - name: Prepare frozen dependencies
        run: |
          deno install --frozen --no-prompt
          deno install --config plugins/code/skills/clean-code/deno.json --frozen --no-prompt
      - name: Check generated references
        run: deno task docs:check
