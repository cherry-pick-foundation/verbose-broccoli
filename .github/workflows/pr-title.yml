name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if ! printf '%s\n' "$TITLE" | grep --extended-regexp --quiet "$pattern"; then
            echo "::error::Use a Conventional Commits title such as 'feat(workspace): add plugin layout'."
            exit 1
          fi
