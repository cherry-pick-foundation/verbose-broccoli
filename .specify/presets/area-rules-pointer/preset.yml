    - { type: "command", name: "speckit.assess.shape", file: "commands/pointer.md", strategy: "prepend" }
    - { type: "command", name: "speckit.assess.decide", file: "commands/pointer.md", strategy: "prepend" }
    - { type: "command", name: "speckit.bug.assess", file: "commands/pointer.md", strategy: "prepend" }
    - { type: "command", name: "speckit.bug.fix", file: "commands/pointer.md", strategy: "prepend" }
    - { type: "command", name: "speckit.bug.test", file: "commands/pointer.md", strategy: "prepend" }
    - { type: "command", name: "speckit.git.validate", file: "commands/pointer.md", strategy: "prepend" }
