[tool.uv]
required-version = ">=0.11.32"
constraint-dependencies = [
  # Backfire's test_package_dependency_versions rejects 0.7.2; uv applies this pin only from the workspace root.
  "typesafe-sdk==0.7.1",
  # Preserve magika 0.6.2 in the lock for Windows.
  "magika<=0.6.3",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.importlinter]
root_packages = [
  "backfire",
  "backfire_education",
  "credit_offers",
  "doc_regions",
  "jev_ultrafast",
  "wiki_consistency",
]

[[tool.importlinter.contracts]]
name = "Workspace package layers"
type = "layers"
layers = [
  "wiki_consistency",
  "backfire_education",
  "backfire | doc_regions",
]
ignore_imports = [
  # Backfire imports this optional adapter only when education is configured.
  "backfire.providers -> backfire_education.pseudonymize",
]

[[tool.importlinter.contracts]]
name = "Python package sibling cycles"
type = "acyclic_siblings"
ancestors = [
  "backfire",
  "backfire_education",
  "credit_offers",
  "doc_regions",
  "jev_ultrafast",
  "wiki_consistency",
]

[tool.turbo]
name = "verbose-broccoli-python"
