# `mise run` would otherwise install the user's missing global tools before the
# task starts. The setup task installs this file's own tools itself.
[settings.task]
run_auto_install = false

[tools]
"aqua:astral-sh/uv" = "0.11.32"
"aqua:bitwarden/sdk-sm" = "2.1.0"
"aqua:caddyserver/caddy" = "2.11.4"
"aqua:loeffel-io/ls-lint" = "2.3.1"
"aqua:lycheeverse/lychee" = "0.24.2"
"aqua:vale-cli/vale" = "3.23.0"
"github:betterleaks/betterleaks" = "1.9.0"
"github:gittower/git-flow-next" = "2.1.0"
"github:googleworkspace/cli" = "0.22.5"
"github:specstoryai/getspecstory" = "2.15.1"

# Quarto stays a separately installed converter (constitution, principle I), so
# its pin lives here, not in [tools]. The hosted check reads both values.
[env]
QUARTO_VERSION = "1.10.18"
QUARTO_LINUX_AMD64_SHA256 = "4bdf5a17df300003beb2f8f0e4dfe568e2ca0ff91318220c8537d2655015c430"

# One setup for a worktree, a runner and Orca. Run it after `mise trust`.
# `mise install --locked` is given the repository's tool names only, so the
# user's global tools are not installed; each name resolves to the version in
# this file, and the lock supplies its checksum. Later commands run under
# `mise exec` so they find the tools that were just installed.
[tasks.setup]
description = "Install the locked tools and every dependency tree"
run = [
  "mise install --locked $(mise ls --local --no-header | awk '{print $1}')",
  "mise exec -- uv python install --no-bin \"$(cat packages/backfire/.python-version)\"",
  "npm ci --ignore-scripts --no-audit --no-fund",
  "mise exec -- npm run wiki-consistency:install",
  "mise exec -- uv sync --locked --project tools/spec-kit",
  "mise exec -- uv sync --locked --project tools/shellcheck",
  "mise exec -- uv sync --locked --project tools/ruff",
  "mise exec -- uv sync --locked --project tools/check-jsonschema",
  "mise exec -- uv sync --locked --project tools/commitizen",
  "npm ci --ignore-scripts --no-audit --no-fund --prefix plugins/work",
  "mise exec -- uv sync --locked --script plugins/work/skills/wiki-raw-import/scripts/raw_import.py",
  "git config gitflow.shared.trustHooks true",
  "mise exec -- git flow config sync",
]

[doctor.checks.quarto]
description = "Quarto is available at QUARTO_VERSION"
run = 'test "$(quarto --version)" = "$QUARTO_VERSION"'
hint = "Install the Quarto version in QUARTO_VERSION and ensure `quarto` is on PATH."
timeout = "5s"

[doctor.checks.codexbar]
description = "CodexBar 0.69.0 is available"
run = 'codexbar --version | head -n 1 | grep -qiE "^codexbar 0[.]69[.]0( |$)"'
hint = "Install CodexBar 0.69.0 and ensure `codexbar` is on PATH."
timeout = "5s"

[doctor.checks.uv-workspace]
description = "The uv workspace and education extra match uv.lock"
run = "uv sync --locked --check --all-packages --extra education"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.uv-spec-kit]
description = "The tools/spec-kit environment matches uv.lock"
run = "uv sync --locked --check"
dir = "tools/spec-kit"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.uv-shellcheck]
description = "The tools/shellcheck environment matches uv.lock"
run = "uv sync --locked --check"
dir = "tools/shellcheck"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.uv-ruff]
description = "The tools/ruff environment matches uv.lock"
run = "uv sync --locked --check"
dir = "tools/ruff"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.uv-check-jsonschema]
description = "The tools/check-jsonschema environment matches uv.lock"
run = "uv sync --locked --check"
dir = "tools/check-jsonschema"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.uv-commitizen]
description = "The tools/commitizen environment matches uv.lock"
run = "uv sync --locked --check"
dir = "tools/commitizen"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.npm-root]
description = "The root npm dependency tree matches package-lock.json"
run = "npm ls --all"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.npm-wiki-consistency]
description = "The wiki-consistency npm dependency tree matches its lock"
run = "npm ls --all"
dir = "packages/wiki-consistency"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.npm-work-plugin]
description = "The work plugin's npm dependency tree matches its lock"
run = "npm ls --all"
dir = "plugins/work"
hint = "Run `mise run setup`."
timeout = "30s"

[doctor.checks.git-flow]
description = "The git-flow configuration matches .gitflow"
run = "git flow config status"
hint = "Run `mise run setup`."
timeout = "5s"

[doctor.checks.lefthook]
description = "The installed Git hooks match .config/lefthook.yml"
run = "./node_modules/.bin/lefthook check-install"
hint = "Run `./node_modules/.bin/lefthook install` from the designated worktree."
timeout = "5s"

[doctor.checks.tools-installed]
description = "Every tool pinned in this file is installed"
run = 'test -z "$(mise ls --local --missing --no-header)"'
hint = "Run `mise run setup`."
timeout = "5s"

[doctor.checks.uv-version]
description = "The uv on PATH has the version pinned in this file"
run = 'test "$(uv --version | cut -d" " -f2)" = "$(mise ls --local --no-header aqua:astral-sh/uv | awk "{print \$2}")"'
hint = "Put a uv with the pinned version first on PATH, or run `mise run setup`."
timeout = "5s"
