[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "doc-regions"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "cogapp==3.6.0",
  "markdown-it-py==4.2.0",
]

[project.scripts]
doc-regions = "doc_regions.__main__:main"

[dependency-groups]
dev = ["jsonschema==4.26.0", "pytest==9.1.1"]

[tool.uv]
required-version = ">=0.11.32"

[tool.uv.build-backend]
module-name = "doc_regions"
module-root = "src"

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
extend = "../../ruff.toml"
