provider = "education"

[providers.education]
api = "openai"
base_url = "https://api-cdn.thehive.ai/api/v3"
model = "deepseek-ai/deepseek-v4.1-flash"
credential = "HIVE_API_KEY"
request = { max_tokens = 32768, response_format = { type = "json_object" }, reasoning_effort = "medium" }

# 110 s for long judgments; 118 s bounds retries and backoff.
[providers.education.retry]
per_attempt_timeout = 110
budget = 118
