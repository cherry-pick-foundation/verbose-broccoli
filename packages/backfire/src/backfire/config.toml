order = ["openrouter", "hive"]

[providers.hive]
api = "openai"
base_url = "https://api-cdn.thehive.ai/api/v3"
model = "deepseek-ai/deepseek-v4.1-flash"
credential_file = "../providers/hive.env"
credential = "HIVE_API_KEY"
request = { max_tokens = 32768, response_format = { type = "json_object" }, reasoning_effort = "medium" }
insufficient_balance = [405]

# 110 s for long judgments; 118 s bounds retries and backoff.
[providers.hive.retry]
per_attempt_timeout = 110
budget = 118

[providers.openrouter]
api = "jev"
jev_provider = "openrouter"
credential = "OPENROUTER_API_KEY"
credential_file = "../providers/openrouter.env"
codexbar = "openrouter"
