provider = "hive"

[providers.hive]
api = "openai"
base_url = "https://api-cdn.thehive.ai/api/v3"
model = "deepseek-ai/deepseek-v4.1-flash"
credential = "HIVE_API_KEY"
request = { max_tokens = 32768, response_format = { type = "json_object" }, reasoning_effort = "medium" }

[providers.vercel]
api = "jev"
jev_provider = "vercel"
base_url = "https://ai-gateway.vercel.sh/v4/ai/evaluation-model"
model = "typesafe-ai/jev"
credential_file = "~/.config/verbose-broccoli/chat/jev.env"
credential = "AI_GATEWAY_API_KEY"
