[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "backfire"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "mcp==2.2.0",
  "rfc8785==0.1.4",
  "system-one-adapter[openai]==0.2.1",
]

[project.optional-dependencies]
education = ["phonenumbers==9.0.40"]

[project.scripts]
backfire = "backfire.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
required-version = ">=0.11.32"
constraint-dependencies = ["typesafe-sdk==0.7.1"]

# Keep install metadata inside the copy's .venv, leaving only .venv/ and __pycache__/ writes.
[tool.uv.build-backend]
module-name = ["backfire", "backfire_tools", "backfire_education"]
module-root = "src"

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
markers = ["slow: deadline and other long-running tests"]
