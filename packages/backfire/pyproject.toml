[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backfire-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "system-one-adapter[openai]==0.2.1",
  "starlette==0.52.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
required-version = "==0.11.32"
constraint-dependencies = ["typesafe-sdk==0.7.1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backfire_backend = ["config.toml"]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
