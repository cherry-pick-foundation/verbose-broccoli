[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "wiki-consistency"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "backfire[education]",
  "bagit==1.9.0",
  "doc-regions",
  "markitdown[docx,pdf,pptx,xlsx]==0.1.8",
  "python-hwpx==6.6.0",
  "PyYAML==6.0.3",
  "pysbd==0.3.4",
]

[project.scripts]
wiki-consistency = "wiki_consistency.__main__:main"

[dependency-groups]
dev = ["import-linter==2.15", "jsonschema==4.26.0", "pytest==9.1.1"]

[tool.uv.sources]
backfire = { workspace = true }
doc-regions = { workspace = true }

[tool.uv.build-backend]
module-name = "wiki_consistency"
module-root = "src"

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
extend = "../../pyproject.toml"
