scripts:
  setup: |
    set -eu

    project_root="$(git rev-parse --show-toplevel)"
    cd "$project_root"
    sh scripts/worktree-branch.sh

    if [ -x "$HOME/.deno/bin/deno" ]; then
      deno_bin="$HOME/.deno/bin/deno"
    elif command -v deno >/dev/null 2>&1; then
      deno_bin="$(command -v deno)"
    else
      echo 'Deno 2.9.6 was not found.' >&2
      exit 127
    fi

    if [ -x "$HOME/.local/bin/uv" ]; then
      uv_bin="$HOME/.local/bin/uv"
    elif command -v uv >/dev/null 2>&1; then
      uv_bin="$(command -v uv)"
    else
      echo 'uv 0.11.32 was not found.' >&2
      exit 127
    fi

    if [ -x "$HOME/.local/bin/git-flow" ]; then
      git_flow_bin="$HOME/.local/bin/git-flow"
    elif command -v git-flow >/dev/null 2>&1; then
      git_flow_bin="$(command -v git-flow)"
    else
      echo 'git-flow 2.1.0 was not found.' >&2
      exit 127
    fi

    export PATH="$(dirname "$uv_bin"):$(dirname "$git_flow_bin"):$(dirname "$deno_bin"):$PATH"

    "$deno_bin" install --frozen --no-prompt
    "$deno_bin" install --frozen --cached-only --no-prompt
    "$uv_bin" sync --locked --project tools/spec-kit
    "$uv_bin" sync --locked --project tools/shellcheck
    "$uv_bin" sync --locked --project tools/ruff
    "$uv_bin" sync --locked --project packages/doc-regions
    "$uv_bin" sync --locked --project packages/wiki-consistency
    npm ci --ignore-scripts --no-audit --no-fund --prefix packages/wiki-consistency
    "$uv_bin" sync --locked --script plugins/work/skills/wiki-raw-import/scripts/raw_import.py
    git config gitflow.shared.trustHooks true
    git config core.hooksPath scripts/git-hooks
    git flow config sync
    "$deno_bin" task doctor
setupAgentStartupPolicy: wait-for-setup
